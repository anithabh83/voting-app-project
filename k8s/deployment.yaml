apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-deployment
  labels:
    app: vote
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: abhanumantharaju/vote:dev
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"       #0.1 CPU core minimum
              memory: "128Mi"   #128 MiB minimum memory
            limits:
              cpu: "200m"       #0.2 CPU core minimum
              memory: "256Mi"   # 256 MiB minimum memory
